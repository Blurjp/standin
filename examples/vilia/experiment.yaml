        - {image: assets/a1.png, caption: "Your postpartum companion. Everything for your fourth trimester"}
        - {image: assets/a2.png, caption: "Track your recovery journey. Log symptoms, mood and milestones"}
        - {image: assets/a3.png, caption: "AI-powered personalized insights. Smart guidance tailored to you"}
        - {image: assets/a4.png, caption: "Join a supportive community. Connect with moms like you"}
        - {image: assets/a5.png, caption: "Daily wellness tips for new moms. Self-care made simple"}
