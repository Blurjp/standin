      name: "Vilia: Postpartum Support"
      subtitle: "Postpartum answers at 3am"
      developer: "Vilia Health"
      icon: assets/icon.png
      category: "Health & Fitness"
      age_rating: "12+"
      in_app_purchases: false
      rating_count: 0
      screenshots:
