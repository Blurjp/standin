# Vilia App Store page: current screenshots vs a redesign.
# EVERYTHING marked PLACEHOLDER must be replaced with your real page before results mean anything:
# screenshots + their captions, subtitle, description, privacy label, IAP flag.
name: "Vilia store page: current vs redesign"
app: "Vilia: Postpartum Support"
n_per_cell: 60
seed: 7
brain: heuristic          # 'claude' for LLM appraisal (needs ANTHROPIC_API_KEY)
journey:
  template: store_page_install
  goal: "Find something that helps with life right after giving birth, and decide whether to download it"
  search_terms: ["postpartum", "after birth", "fourth trimester", "new moms", "recovery"]
  max_steps: 12

segments:
  - id: newmom
    name: "New mom, 0-6 weeks"
    weight: 0.55
    context: >-
      Gave birth a few weeks ago. Feeding the baby at 3am, phone in one hand, screen dimmed,
      exhausted. Searched the App Store because something feels off and she wants to know if it's normal.
    situation: [low_brightness, one_handed, interrupted]
    traits:
      intent: {mean: 0.75}
      patience: {mean: 0.30}
      price_sensitivity: {mean: 0.50}
      trust_threshold: {mean: 0.50}
      tech_savvy: {mean: 0.55}
      attention_budget: {mean: 0.30}
      privacy_sensitivity: {mean: 0.75}
    needs: ["3am", "night", "what's normal", "normal after birth", "recovery", "bleeding",
            "breastfeeding", "sleep", "one-handed", "answers", "in seconds"]
    turnoffs: ["journey"]

  - id: partner
    name: "Partner or family member"
    weight: 0.25
    context: >-
      Searching on her behalf in the evening. Reads carefully, compares apps, wants to know
      it's credible and how he can actually help.
    traits:
      intent: {mean: 0.65}
      patience: {mean: 0.65}
      price_sensitivity: {mean: 0.45}
      trust_threshold: {mean: 0.65}
      tech_savvy: {mean: 0.65}
      attention_budget: {mean: 0.70}
      privacy_sensitivity: {mean: 0.55}
    needs: ["partner", "how to help", "help tonight", "what's normal", "warning signs",
            "needs a call", "call your doctor", "doctor", "nurse"]
    turnoffs: ["daily wellness tips"]

  - id: secondtime
    name: "Second-time mom"
    weight: 0.20
    context: >-
      Has done this before, has a toddler too. Picky; generic advice feels useless.
      Wants something specific she didn't get the first time.
    traits:
      intent: {mean: 0.55}
      patience: {mean: 0.40}
      price_sensitivity: {mean: 0.60}
      trust_threshold: {mean: 0.60}
      tech_savvy: {mean: 0.60}
      attention_budget: {mean: 0.50}
      privacy_sensitivity: {mean: 0.65}
    needs: ["second baby", "toddler", "sibling", "round two", "specific", "what's normal"]
    turnoffs: ["daily wellness tips", "journey", "companion", "for new moms", "self-care"]

variants:
